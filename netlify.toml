[build]
  command = "npm install && cd netlify/functions && npm install express serverless-http mongoose cors dotenv bcryptjs jsonwebtoken express-rate-limit helmet moment ws && cd ../.. && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8081
  targetPort = 8081

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
